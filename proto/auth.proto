syntax = "proto3";

// Auth Service (Identity & Access Bounded Context): bang User, Role. DB: PostgreSQL (Auth DB)
// Duoc API Gateway goi qua gRPC.
package auth;

service AuthService {
  rpc Register    (RegisterRequest)    returns (RegisterReply);     // tao User voi role CUSTOMER
  rpc Login       (LoginRequest)       returns (LoginReply);        // tra JWT
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenReply);  // Gateway kiem tra JWT (BPM buoc 2)
  rpc DeleteUser  (DeleteUserRequest)  returns (DeleteUserReply);   // bu tru khi tao Customer that bai
}

message RegisterRequest { string username = 1; string password = 2; }
message RegisterReply   { int32 uid = 1; }

message LoginRequest { string username = 1; string password = 2; }
message LoginReply   { string access_token = 1; string token_type = 2; int32 expires_in = 3; }

message VerifyTokenRequest { string token = 1; }
message VerifyTokenReply   { int32 uid = 1; string role = 2; string username = 3; }

message DeleteUserRequest { int32 uid = 1; }
message DeleteUserReply   { bool success = 1; }
