syntax = "proto3";

// Order Service (Order Management Bounded Context): bang Order, OrderDetail (+ OutboxEvent).
// DB: PostgreSQL (Order DB). Duoc API Gateway goi qua gRPC.
package order;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderReply);  // BPM buoc 5-9
  rpc ListOrders  (Empty)              returns (OrderList);
  rpc GetOrder    (GetOrderRequest)    returns (OrderReply);
}

message Empty {}
message OrderItemInput { int32 pid = 1; int32 qty = 2; }

message CreateOrderRequest {
  int32 uid   = 1;   // tu JWT (Gateway)
  int32 score = 2;   // diem thanh vien lay tu Customer Service (BPM buoc 4)
  repeated OrderItemInput items = 3;
}

message OrderItem { int32 pid = 1; int32 qty = 2; double unit_price = 3; }

message OrderReply {
  int32  oid          = 1;
  int32  uid          = 2;
  double discount     = 3;   // % giam gia
  double subtotal     = 4;
  double total_amount = 5;
  repeated OrderItem items = 6;
  string shipment_status   = 7;
}

message OrderList { repeated OrderReply items = 1; }
message GetOrderRequest { int32 oid = 1; }
