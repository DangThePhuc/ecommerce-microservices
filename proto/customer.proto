syntax = "proto3";

// Customer Service (Customer & Membership Bounded Context): bang Customer, Membership.
// DB: PostgreSQL (Customer DB). Duoc API Gateway goi qua gRPC.
package customer;

service CustomerService {
  rpc CreateCustomer (CreateCustomerRequest) returns (Customer);        // sau khi dang ky: hang Normal
  rpc GetCustomer    (GetCustomerRequest)    returns (Customer);        // BPM buoc 3: uid, fullname, mid
  rpc UpdateCustomer (UpdateCustomerRequest) returns (MessageReply);
  rpc GetMembership  (GetCustomerRequest)    returns (Membership);      // BPM buoc 4: mname, score
}

message CreateCustomerRequest { int32 uid = 1; string fullname = 2; }
message GetCustomerRequest    { int32 uid = 1; }

message UpdateCustomerRequest {
  int32  uid          = 1;
  bool   has_fullname = 2;
  string fullname     = 3;
  bool   has_mid      = 4;
  int32  mid          = 5;
}

message Customer   { int32 uid = 1; string fullname = 2; int32 mid = 3; }
message Membership { int32 uid = 1; int32 mid = 2; string mname = 3; int32 score = 4; }
message MessageReply { string message = 1; int32 id = 2; }
