syntax = "proto3";

// Shipment Service (Shipment Bounded Context): Shipment (shipid, oid, status) + Tracking.
// DB: MongoDB (Shipment DB). Shipment duoc tao tu Kafka event OrderCreated; REST/gRPC chi de xem va cap nhat trang thai.
package shipment;

service ShipmentService {
  rpc GetShipment          (GetShipmentRequest)          returns (Shipment);
  rpc ListShipments        (ListShipmentsRequest)        returns (ShipmentList);
  rpc UpdateShipmentStatus (UpdateShipmentStatusRequest) returns (Shipment);  // SHIPMENT_STAFF / ADMIN
}

message GetShipmentRequest { int32 shipid = 1; }
message ListShipmentsRequest { bool has_oid = 1; int32 oid = 2; }
message UpdateShipmentStatusRequest { int32 shipid = 1; string status = 2; }

message Shipment { int32 shipid = 1; int32 oid = 2; string status = 3; }
message ShipmentList { repeated Shipment items = 1; }
