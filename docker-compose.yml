name: ecommerce-mvp

x-restart: &restart
  restart: unless-stopped

x-svc-health: &svc-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  # ====================== Ha tang ======================
  redis:
    image: redis:7-alpine
    container_name: redis
    <<: *restart
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    <<: *restart
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ====================== Database-per-Service ======================
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    <<: *restart
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  postgres-customer:
    image: postgres:16-alpine
    container_name: postgres-customer
    <<: *restart
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_customer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d customer_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    <<: *restart
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  mongo-product:
    image: mongo:7
    container_name: mongo-product
    <<: *restart
    volumes:
      - mongo_product_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-shipment:
    image: mongo:7
    container_name: mongo-shipment
    <<: *restart
    volumes:
      - mongo_shipment_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ====================== Microservices ======================
  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    <<: *restart
    environment:
      PORT: 3002
      GRPC_PORT: 50052
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-customer:5432/customer_db
    depends_on:
      postgres-customer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health > /dev/null || exit 1"]
      <<: *svc-health

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    <<: *restart
    environment:
      PORT: 3001
      GRPC_PORT: 50051
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STAFF_USERNAME: ${STAFF_USERNAME}
      STAFF_PASSWORD: ${STAFF_PASSWORD}
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health > /dev/null || exit 1"]
      <<: *svc-health

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    <<: *restart
    environment:
      PORT: 3003
      GRPC_PORT: 50053
      MONGO_URL: mongodb://mongo-product:27017
    depends_on:
      mongo-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health > /dev/null || exit 1"]
      <<: *svc-health

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    <<: *restart
    environment:
      PORT: 3004
      GRPC_PORT: 50054
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-order:5432/order_db
      PRODUCT_GRPC_URL: product-service:50053
      KAFKA_BROKER: kafka:9092
      ORDER_CREATED_TOPIC: ${ORDER_CREATED_TOPIC}
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health > /dev/null || exit 1"]
      <<: *svc-health

  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: shipment-service
    <<: *restart
    environment:
      PORT: 3005
      GRPC_PORT: 50055
      MONGO_URL: mongodb://mongo-shipment:27017
      KAFKA_BROKER: kafka:9092
      ORDER_CREATED_TOPIC: ${ORDER_CREATED_TOPIC}
    depends_on:
      mongo-shipment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health > /dev/null || exit 1"]
      <<: *svc-health

  # ====================== API Gateway ======================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    <<: *restart
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      AUTH_GRPC_URL: auth-service:50051
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      ORDER_GRPC_URL: order-service:50054
      SHIPMENT_GRPC_URL: shipment-service:50055
      AUTH_HEALTH_URL: http://auth-service:3001/health
      CUSTOMER_HEALTH_URL: http://customer-service:3002/health
      PRODUCT_HEALTH_URL: http://product-service:3003/health
      ORDER_HEALTH_URL: http://order-service:3004/health
      SHIPMENT_HEALTH_URL: http://shipment-service:3005/health
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy

volumes:
  kafka_data:
  pg_auth_data:
  pg_customer_data:
  pg_order_data:
  mongo_product_data:
  mongo_shipment_data:
