name: ecommerce

# Kiến trúc: API Gateway + 5 service (Database-per-Service) + Redis + Kafka
# Tổng cộng 13 container:
#   api-gateway, redis, kafka,
#   auth-service/auth-db, customer-service/customer-db, order-service/order-db,
#   product-service/product-db, shipment-service/shipment-db

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 3s
  retries: 20

x-mongo-health: &mongo-health
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ───────────────────────── API Gateway + Redis ─────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-3003}:3003"
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
      AUTH_GRPC_URL: auth-service:50051
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      ORDER_GRPC_URL: order-service:50054
      SHIPMENT_GRPC_URL: shipment-service:50055
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      CACHE_TTL_SEC: ${CACHE_TTL_SEC:-30}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ───────────────────────── Identity & Access ─────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    environment:
      GRPC_PORT: 50051
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Staff@123}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck: *pg-health
    restart: unless-stopped

  # ───────────────────────── Customer & Membership ─────────────────────────
  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    environment:
      GRPC_PORT: 50052
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@customer-db:5432/customer_db
    depends_on:
      customer-db:
        condition: service_healthy
    restart: unless-stopped

  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: customer_db
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck: *pg-health
    restart: unless-stopped

  # ───────────────────────── Product Catalog ─────────────────────────
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    environment:
      GRPC_PORT: 50053
      MONGO_URL: mongodb://product-db:27017
      MONGO_DB: product_db
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped

  product-db:
    image: mongo:7
    container_name: product-db
    volumes:
      - product-db-data:/data/db
    healthcheck: *mongo-health
    restart: unless-stopped

  # ───────────────────────── Order Management ─────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    environment:
      GRPC_PORT: 50054
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@order-db:5432/order_db
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: order-created
      OUTBOX_INTERVAL_MS: 1000
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: order_db
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck: *pg-health
    restart: unless-stopped

  # ───────────────────────── Shipment ─────────────────────────
  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: shipment-service
    environment:
      GRPC_PORT: 50055
      MONGO_URL: mongodb://shipment-db:27017
      MONGO_DB: shipment_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: order-created
      KAFKA_GROUP_ID: shipment-service
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  shipment-db:
    image: mongo:7
    container_name: shipment-db
    volumes:
      - shipment-db-data:/data/db
    healthcheck: *mongo-health
    restart: unless-stopped

  # ───────────────────────── Message Broker (KRaft, không cần Zookeeper) ─────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  redis-data:
  auth-db-data:
  customer-db-data:
  product-db-data:
  order-db-data:
  shipment-db-data:
  kafka-data:
